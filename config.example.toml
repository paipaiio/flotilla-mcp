# Flotilla 示例配置
# 复制为 ~/.config/flotilla/config.toml（macOS: ~/Library/Application Support/flotilla/config.toml）
# 或启动时传 --config <path>，或设置 FLOTILLA_CONFIG 环境变量。

[defaults]
approvalMode = "ask-destructive"   # auto | ask-destructive | ask-all | deny
commandQuotaPerDay = 0             # 滚动 24h 命令类调用上限（exec/exec-read/exec-sudo），0 = 不限
jitGrantTtlMs = 900000              # 交互审批「不再询问」的免批时长（毫秒），0 = 每次必问
commandTimeoutMs = 60000
maxConcurrency = 16
rollingBatchSize = 2
rollingMaxBatchFailures = 0        # 批次内任何失败即熔断

# ── 服务器 ─────────────────────────────────────────────
# group 是策略层级（prod/staging/dev 或自定义），不填时按名字推断，
# 推断不出一律按最严的 prod 处理。

[[servers]]
name = "bastion"
host = "bastion.example.com"
user = "deploy"
auth = "agent"                     # 推荐：走 SSH agent，不留密钥于内存
group = "prod"
tags = ["infra"]

[[servers]]
name = "web-1"
host = "10.0.1.11"
user = "deploy"
auth = "key"
keyRef = "~/.ssh/id_ed25519"
group = "prod"
tags = ["web", "cn-east"]
via = "bastion"                    # 经跳板机，无 agent forwarding

[[servers]]
name = "build-box"
host = "192.168.1.5"
user = "builder"
auth = "password"                  # 密码: FLOTILLA_BUILD_BOX_PASSWORD / FLOTILLA_PASSWORD 环境变量,
                               # 或 OS 钥匙串: flotilla keychain set build-box
group = "dev"
tags = ["ci"]
role = "admin"

# 只读监控机示例
[[servers]]
name = "mon-1"
host = "10.0.3.5"
user = "monitor"
auth = "agent"
group = "prod"
readOnly = true

# ── 分组 ─────────────────────────────────────────────
[[groups]]
name = "web-prod"
match = { group = "prod", tags = ["web"] }

[[groups]]
name = "everything-east"
match = { tags = ["cn-east"] }

# ── 资源级授权（第二层，叠加在角色×层级矩阵之上，只收窄）─────
# [[servers]]
# name = "app-1"
# ...
# [servers.scopes]
# paths = ["/opt/myapp/**"]
# services = ["myapp.service"]
# commands = ["^git (pull|status)$"]

# ── 远程配置拉取（可选）─────────────────────────────────────
# 从 HTTP(S) URL 拉取整份 fleet 配置：校验通过后备份旧文件、原子写入、
# MCP server 热重载。Git 托管用 raw 文件 URL：
#   GitHub:  https://raw.githubusercontent.com/<org>/<repo>/<ref>/fleet.toml
#   GitLab:  https://gitlab.com/<org>/<repo>/-/raw/<ref>/fleet.toml
# [remote]
# url = "https://raw.githubusercontent.com/acme/ops-fleet/main/fleet.toml"
# tokenEnv = "FLOTILLA_CONFIG_TOKEN"   # 私有仓库：env 里的 token 走 Authorization: Bearer
# refreshMs = 300000                    # MCP server 每 5 分钟自动拉取+热重载；缺省只手动
#
# 手动拉取：node scripts/fleet.mjs pull-config（或 MCP 工具 config-pull，需审批）

# ── AI 辅助审批（可选，默认关闭）─────────────────────────────
# 破坏性/特权操作触发审批弹窗时，先由本地 LLM 生成风险评估卡（摘要/风险/建议），
# 人看卡决策。AI 只做建议、永不做判决；任何失败（离线/超时/乱码）自动降级为无卡片，
# 审批流程不受影响。兼容任何 OpenAI chat-completions 端点（Ollama / LM Studio / vLLM…）。
# 被审命令以 <action> 数据标签包裹送入，提示注入内建防护。
# [aiAssessor]
# enabled = true
# url = "http://localhost:11434/v1/chat/completions"   # Ollama 默认
# model = "qwen3:8b"
# apiKeyEnv = "FLOTILLA_LLM_KEY"    # 本地无鉴权可省；远程 API 用 env 里的 key
# timeoutMs = 15000
