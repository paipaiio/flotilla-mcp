# Flotilla Gateway 反向代理模板（nginx）
# 把 flotilla-gateway.example.com 换成你的域名。
# TLS 证书由 certbot / 内部 CA 提供（示例路径留给 certbot 标准布局）。
#
# 认证仍由网关本身做（每个 /mcp 请求都要 Bearer token）；
# 反代层只负责 TLS 终结和流式响应透传。

server {
    listen 443 ssl;
    server_name flotilla-gateway.example.com;

    # ssl_certificate     /etc/letsencrypt/live/flotilla-gateway.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/flotilla-gateway.example.com/privkey.pem;

    # 与网关的 body 上限（4 MB）保持一致
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamable HTTP 的 SSE/长轮询需要透传流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
