name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Coverage gate (includes deterministic fuzz and 30-tool MCP integration)
        run: pnpm test:coverage

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only (no push) — proves the Dockerfile stays healthy on every commit.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: flotilla-mcp:ci
